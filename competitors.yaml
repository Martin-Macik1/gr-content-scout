run_config:
  cadence: weekly
  preferred_run_time: "Monday 08:00 Europe/Bratislava"
  output_dir: reports
  state_file: reports/content-state.json
  slack_channel: "_gr-opportunity-scout"
  language: sk
  lookback_days: 14
  lens:
    company: GoodRequest
    positioning: AI-Augmented Delivery
    focus:
      - human-in-the-loop senior experts
      - Secure SDLC
      - regulated fintech and banking
      - quality and delivery-risk reduction over lowest price
  change_policy:
    report_only_meaningful_changes: true
    ignore:
      - cosmetic website changes
      - duplicated PR syndication without new content
      - generic AI buzzwords without a real angle

# Obsahovo zamerané signály (čo konkurencia PUBLIKUJE, nie positioning/ponuka)
tracked_signals:
  - content_topics_and_themes          # o čom píšu / hovoria
  - content_formats                    # blog, case study, whitepaper, carousel, video, webinar, podcast
  - headline_hooks_and_angles          # ako to rámujú
  - case_studies_with_metrics_roi      # štúdie s konkrétnymi číslami
  - lead_magnets_and_gated_content     # e-booky, kalkulačky, šablóny
  - linkedin_topics_and_engagement     # čo rezonuje, reakcie/komentáre
  - newsjacking_and_seasonal_angles    # EU AI Act, DORA, PSD3, incidenty, konferencie
  - distribution_and_cadence           # ako často a kde publikujú
  - content_gaps                       # čo nikto nepokrýva dobre = príležitosť pre GR

# Typy zdrojov, ktoré agent pri každom konkurentovi hľadá
content_source_types:
  - blog
  - case_studies
  - whitepapers_ebooks
  - webinars_events
  - podcast
  - linkedin_company
  - linkedin_key_people
  - newsletter

